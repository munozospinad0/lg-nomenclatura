<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1A1A1A;

  .caja{width:100%;max-width:380px;text-align:left}
  .pts{display:flex;gap:5px;margin-bottom:22px}
  .pts i{width:8px;height:8px;border-radius:50%;display:block}

  button{width:100%;margin-top:11px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;
         padding:12px;border:0;border-radius:7px;background:#FAD530;color:#1A1A1A}

  button:disabled{opacity:.5;cursor:progress}
  .err{margin-top:11px;font-size:13px;color:#FF8A73;min-height:19px}

<div class="caja" id="caja" hidden>
  <div class="pts"><i></i><i></i><i></i></div>
  <h1>Nomenclatura LG &middot; Ariadna</h1>
  <p class="s">Esta p&aacute;gina est&aacute; cifrada. Escribe la clave una vez y no se te vuelve a pedir en este equipo.</p>
  <form id="f">
    <label for="c">Clave</label>
    <input id="c" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Entrar</button>
    <div class="err" id="e"></div>
  </form>
  <p class="pie">El contenido no viaja en claro: se descifra aqu&iacute;, en tu equipo.
     Nadie sin la clave puede leerlo, ni siquiera con el enlace.</p>
</div>

     pedir la clave, y eso es justo lo que molestaba. En localStorage se pide
     una vez por equipo. Se guarda la llave derivada, nunca la clave. */
  var guardar = function (v) { try { localStorage.setItem(LLAVE, v); } catch (e) {} };
  var leer    = function ()  { try { return localStorage.getItem(LLAVE); } catch (e) { return null; } };
  var olvidar = function ()  { try { localStorage.removeItem(LLAVE); } catch (e) {} };

  function pedirClave() {
    var caja = document.getElementById('caja');
    caja.hidden = false;
    var c = document.getElementById('c');
    if (c) c.focus();
  }

  function abrir(llave) {
    var d = bytes(DATOS);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, llave, d.slice(12))
      .then(function (plano) {
        return crypto.subtle.exportKey('raw', llave).then(function (raw) {
          guardar(btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
          var html = new TextDecoder().decode(plano);
          document.open(); document.write(html); document.close();
        });
      });
  }

  function derivar(clave) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(SAL), iterations: VUELTAS, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  if (!window.crypto || !crypto.subtle) {
    document.body.innerHTML = '<div class="caja"><h1>Este navegador no puede descifrar la página</h1>' +
      '<p class="s">Hace falta una conexión segura (https). Abre el enlace con https:// delante.</p></div>';
    return;
  }

  // Si ya se entro antes en este equipo, no se vuelve a preguntar nada.
  var guardada = leer();
  if (guardada) {
    crypto.subtle.importKey('raw', bytes(guardada), 'AES-GCM', true, ['decrypt'])
      .then(abrir)
      .catch(function () { olvidar(); pedirClave(); });   // la llave ya no sirve (se republico)
  } else {
    pedirClave();
  }

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('b'), e = document.getElementById('e');
    b.disabled = true; b.textContent = 'Descifrando…'; e.textContent = '';
    derivar(document.getElementById('c').value)
      .then(abrir)
      .catch(function () {
        b.disabled = false; b.textContent = 'Entrar';
        e.textContent = 'Esa clave no abre el contenido.';
        document.getElementById('c').select();
      });
  });
})();
</script>
